<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #cf1010;
            box-sizing: border-box;
        }

        main {
            background-color: #FFFFFF;
            color: #183C63;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            gap: 16px; /* Adiciona espaçamento entre a imagem e o texto */
            box-sizing: border-box;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }

        button {
            cursor: pointer;
            padding: 6px 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="Ícone estilizado de um livro aberto com um computador e dados binários flutuantes, representando a união entre tecnologia e educação.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Maria Luiza</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>        
            <button type="button">❤️ <span>0</span></button>
            <button type="button">👍 <span>0</span></button>
        </div>
    </main>

    <script>
        // Correção do método (querySelectorAll)
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                let.textContent++;
            });
        });
    </script>
</body>
</html>
